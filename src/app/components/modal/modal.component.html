<div [id]="idModal" class="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{title | translate}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ng-content select="subtitle" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    {{'cancel' | translate | titlecase}}
                </button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="confirm()">
                    {{'confirm' | translate | titlecase}}
                </button>
            </div>
        </div>
    </div>
</div>
