<div [id]="idToast" class="toast align-items-center text-bg-primary border-0 position-fixed bottom-0 end-0 p-3 m-3"
  role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body">{{ message | translate }}</div>
    <div class="buttons">
      <button *ngIf="button" type="button" class="btn btn-success me-2 m-auto" data-bs-dismiss="toast"
        (click)="button.buttonAction()">
        {{button.buttonText | translate}}
      </button>
    </div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
      aria-label="Close"></button>
  </div>
</div>
