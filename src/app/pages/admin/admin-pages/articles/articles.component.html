<div class="container-fluid">
    <!-- <app-toast idToast="confirmCategoryDeletion" message="confirm_category_deletion" [button]="toastButton"></app-toast> -->

    <app-modal idModal="confirmCategoryDeletion" [title]="modalTitle" (onConfirm)="modalConfirm()">
        <subtitle>
            <p>{{selectedArticle?.name}}</p>
        </subtitle>
    </app-modal>

    <app-infinite-scroll-list title="articles" [structure]="tableStructure" [showEdit]="true" [showDelete]="true"
        [load]="loadArticles.bind(this)" [delete]="deleteArticle.bind(this)"
        [update]="updateArticle.bind(this)"></app-infinite-scroll-list>

</div>
